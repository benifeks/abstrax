@if (overlayService.activeOverlay(); as module) {
  <div class="overlay-backdrop" (click)="onClose()">
    <div class="overlay-window" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="close-btn"
        (click)="onClose()"
        aria-label="Close overlay"
      >
        <svg viewBox="0 0 24 24" class="close-icon">
          <path
            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
          />
        </svg>
      </button>

      <div class="overlay-content">
        @switch (module) {
          @case ("picsum") {
            <div style="padding: var(--space-4); text-align: center">
              <app-picsum-gallery></app-picsum-gallery>
            </div>
          }
          @case ("auth") {
            <div style="padding: var(--space-4); text-align: center">
              <app-auth-status></app-auth-status>
            </div>
          }
          @default {
            <div style="padding: var(--space-4); text-align: center">
              🚀 Тестовый модуль: {{ module }}
            </div>
          }
        }
      </div>
    </div>
  </div>
}
